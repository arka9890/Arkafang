name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "OpenFang version tag (default: v0.6.9)"
        required: false
        default: "v0.6.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew 2>/dev/null || echo "no gradlew wrapper"

      - name: Restore proot asset (from compile-proot workflow)
        # The proot binary is uploaded by compile-proot.yml as an artifact.
        # If the asset isn't in the repo, this step is a no-op — the APK
        # will still build (proot binary will be missing from assets,
        # but the daemon won't start at runtime until it's present).
        # The user should run compile-proot first, or merge its artifact.
        continue-on-error: true
        run: |
          if [ -f app/src/main/assets/proot/proot ]; then
            echo "proot binary already present"
          else
            echo "proot binary missing; running build script if NDK available"
            if [ -n "$ANDROID_NDK_HOME" ]; then
              NDK="$ANDROID_NDK_HOME" REPO_ROOT="$GITHUB_WORKSPACE" \
                ./scripts/build-proot-android.sh || echo "proot build failed"
            fi
          fi

      - name: Build debug APK (unsigned, for dev)
        run: ./gradlew :app:assembleDebug

      - name: Set up signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            # Write a local gradle.properties override (NOT committed)
            cat >> gradle.properties <<EOF
signing.storeFile=keystore.jks
signing.storePassword=$KEYSTORE_PASSWORD
signing.keyAlias=$KEY_ALIAS
signing.keyPassword=$KEY_PASSWORD
EOF
            echo "signing config written to gradle.properties"
          else
            echo "No signing secrets — release build will be unsigned"
          fi

      - name: Build signed release APK
        run: |
          if [ -f keystore.jks ]; then
            ./gradlew :app:assembleRelease
            ls -lh app/build/outputs/apk/release/
          else
            echo "skipping release build (no keystore)"
          fi

      - name: Collect APK
        run: |
          mkdir -p apk/
          if ls app/build/outputs/apk/release/*.apk 2>/dev/null; then
            cp app/build/outputs/apk/release/*.apk apk/
          else
            cp app/build/outputs/apk/debug/*.apk apk/
          fi
          ls -lh apk/

      - uses: actions/upload-artifact@v4
        with:
          name: openfang-android-apk
          path: apk/*.apk
          retention-days: 90

      - name: Upload as release asset (optional)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.6.9' }}
        run: |
          apkfile=$(ls apk/*.apk | head -1)
          gh release create "android-${TAG}" \
            --title "OpenFang Android ${TAG}" \
            --notes "Sideload APK for OpenFang on Android (Proot-based). See README." \
            --draft=false \
            --generate-notes \
            "$apkfile" || echo "release upload skipped (may already exist)"
